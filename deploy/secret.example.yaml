# 示例：AcGay 音频站的 k8s Secret（不要提交真实值！）
#
# 方式一（推荐，不落盘）：
#   kubectl create secret generic node-web-secret \
#     --from-literal=DB_HOST=... --from-literal=DB_PORT=3306 ...
#
# 方式二：复制本文件为 secret.yaml，填值后 `kubectl apply -f secret.yaml`，
# 并确保 secret.yaml 已被 .gitignore 忽略（本目录下已忽略 secret.yaml）。
#
# 键名必须与 deploy/k8s.yaml 里的 secretKeyRef 完全一致（大小写敏感）。
apiVersion: v1
kind: Secret
metadata:
  name: node-web-secret
  labels:
    app.kubernetes.io/name: node-web
    app.kubernetes.io/part-of: acgay
type: Opaque
stringData:
  DB_HOST: mysql.default.svc.cluster.local
  DB_PORT: "3306"
  DB_USER: acgay
  DB_PASSWORD: change-me-strong-password
  DB_NAME: acgay
  # openssl rand -hex 32
  SESSION_SECRET: change-me-64-hex-characters
  OSS_BASE_URL: https://acgay.oss-cn-hangzhou.aliyuncs.com
  NEXT_PUBLIC_SITE_URL: https://acgay.cn
